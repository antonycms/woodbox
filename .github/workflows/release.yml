name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        platform:
          # - name: Windows
          #   os: windows-latest
          #   script: build:win
          #   artifact: windows
          # - name: macOS
          #   os: macos-26-intel
          #   script: build:mac:x64
          #   artifact: macos-x64
          - name: macOS Apple Silicon
            os: macos-26
            script: build:mac:arm64
            artifact: macos-arm64
          # - name: Linux
          #   os: ubuntu-latest
          #   script: build:linux
          #   artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run ${{ matrix.platform.script }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Release $TAG_NAME"

          shopt -s nullglob
          assets=(dist/*.AppImage dist/*.dmg dist/*.exe dist/*.zip dist/*.blockmap)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --clobber

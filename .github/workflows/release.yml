name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, upload and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            script: build:win
            artifact: windows
          - name: macOS Universal
            os: macos-26
            script: build:mac
            artifact: macos-universal
          - name: Linux
            os: ubuntu-latest
            script: build:linux
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run ${{ matrix.platform.script }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          notes_file="$(mktemp)"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

          tag_type="$(git cat-file -t "refs/tags/$TAG_NAME" 2>/dev/null || true)"

          if [ "$tag_type" = "tag" ]; then
            git for-each-ref "refs/tags/$TAG_NAME" --format='%(contents)' > "$notes_file"
          fi

          if [ ! -s "$notes_file" ]; then
            echo "Release $TAG_NAME" > "$notes_file"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file "$notes_file"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file "$notes_file" || \
              gh release edit "$TAG_NAME" --notes-file "$notes_file"
          fi

          shopt -s nullglob
          assets=(dist/*.AppImage dist/*.deb dist/*.rpm dist/*.dmg dist/*.exe dist/*.zip dist/*.blockmap dist/*.yml)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
